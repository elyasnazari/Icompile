name: inspect-chaquopy
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - run: git clone --depth 1 https://github.com/chaquo/chaquopy.git
      - name: Report
        run: |
          cd chaquopy
          echo "== pypi dir =="; ls server/pypi
          echo "== README-old (head) =="; head -70 server/pypi/README-old.md
          echo "== numpy recipe =="; cat server/pypi/packages/numpy/meta.yaml
          ls server/pypi/packages/numpy server/pypi/packages/numpy/patches
          echo "== target script =="; find . -name "download-target.sh" | head
          echo "== android =="; echo "$ANDROID_HOME"; ls "$ANDROID_HOME/ndk"
