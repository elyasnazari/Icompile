name: ساخت wheel نامپای برای اندروید armv7l (پایدروید ۳)

on:
  workflow_dispatch:

jobs:
  build_wheels_android:
    name: ساخت wheel برای اندروید armv7l
    runs-on: ubuntu-latest

    steps:
      - name: نصب پایتون ۳.۱۳
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: نصب cibuildwheel
        run: python -m pip install cibuildwheel

      - name: دریافت سورس‌کد NumPy
        run: git clone --depth 1 https://github.com/numpy/numpy.git numpy-src

      - name: ساخت wheel برای اندروید armv7l
        run: |
          cd numpy-src  # ورود به پوشه سورس NumPy
          python -m cibuildwheel \
            --platform android \
            --archs armv7l \
            --output-dir ../wheelhouse \
            .
        env:
          CIBW_ARCHS_ANDROID: "armv7l"
          CIBW_ANDROID_API_LEVEL: "24"
          CIBW_BUILD: "cp313-*"

      - name: آپلود فایل wheel
        uses: actions/upload-artifact@v4
        with:
          name: numpy-android-armv7l-wheel
          path: wheelhouse/*.whl
