name: Build NumPy wheel for Android armv7l (Pydroid 3)

on:
  workflow_dispatch:  # 允许在 GitHub 页面手动触发

jobs:
  build_wheels_android:
    name: Build Android armv7l wheel
    runs-on: ubuntu-latest  # Android 构建需要 Linux x86_64 运行器

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13 (Android 构建的硬性要求)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel

      - name: Build wheel for Android armv7l
        run: |
          python -m cibuildwheel \
            --platform android \
            --archs armv7l \
            --output-dir wheelhouse \
            .
        env:
          CIBW_ARCHS_ANDROID: "armv7l"       # 对应 Pydroid 3 的 armeabi-v7a
          CIBW_ANDROID_API_LEVEL: "24"       # NumPy 最低要求的 API 级别
          CIBW_BUILD: "cp313-*"              # 只构建 CPython 3.13 的 wheel

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: numpy-android-armv7l-wheel
          path: wheelhouse/*.whl
